<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel | Plataforma ITSX</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <main class="tarjeta">
    <h1>Panel principal</h1>
    <div class="datos-usuario">
      <div>Bienvenido(a), <strong id="nombreUsuario"></strong></div>
      <div>Correo: <span id="correoUsuario"></span></div>
      <div>Rol: <span id="rolUsuario" class="etiqueta-rol"></span></div>
    </div>
    <div id="seccionAdmin" hidden>
      <h2>Resumen de usuarios (administrador)</h2>
      <ul id="listaResumen"></ul>
    </div>
    <button type="button" id="btnSalir" class="secundario">Cerrar sesión</button>
    <div id="mensaje" class="mensaje" role="alert"></div>
  </main>
  <script src="js/api.js"></script>
  <script src="js/panel.js"></script>
</body>
</html>

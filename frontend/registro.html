<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro | Plataforma ITSX</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <main class="tarjeta">
    <h1>Crear cuenta de estudiante</h1>
    <form id="formRegistro" novalidate>
      <label for="nombre">Nombre(s)</label>
      <input id="nombre" name="nombre" type="text" maxlength="80" required>

      <label for="apellidos">Apellidos</label>
      <input id="apellidos" name="apellidos" type="text" maxlength="100" required>

      <label for="correo">Correo institucional</label>
      <input id="correo" name="correo" type="email" required>

      <label for="numeroControl">Número de control</label>
      <input id="numeroControl" name="numeroControl" type="text" maxlength="20" required>

      <label for="semestre">Semestre</label>
      <input id="semestre" name="semestre" type="number" min="1" max="12" required>

      <label for="contrasena">Contraseña</label>
      <input id="contrasena" name="contrasena" type="password" autocomplete="new-password" required>
      <span class="ayuda">Mínimo 8 caracteres, con mayúscula, minúscula y número.</span>

      <label for="confirmar">Confirmar contraseña</label>
      <input id="confirmar" type="password" autocomplete="new-password" required>

      <button type="submit" id="btnRegistrar">Registrarme</button>
    </form>
    <div id="mensaje" class="mensaje" role="alert"></div>
    <p class="enlaces">¿Ya tienes cuenta? <a href="index.html">Iniciar sesión</a></p>
  </main>
  <script src="js/api.js"></script>
  <script src="js/registro.js"></script>
</body>
</html>
